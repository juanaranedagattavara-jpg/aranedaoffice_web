server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fuerza HTTPS cuando el proxy (Cloudflare) indica que la petición original fue HTTP.
    # Se revisa X-Forwarded-Proto en vez de $scheme para no generar loops de redirección
    # detrás de un proxy que termina TLS y reenvía al origen por HTTP.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Contenido duplicado: /pagina.html -> /pagina (redirección permanente)
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    location ~* \.(?:css|js|svg|webp|png|jpg|jpeg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
